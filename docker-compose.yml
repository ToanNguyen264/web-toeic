name: toeic-vocabulary

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    env_file:
      - ./toeic-vocabulary-be/.env
    environment:
      TZ: Asia/Bangkok
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [toeic_network]

  backend:
    image: toeic-vocabulary-backend:dev
    build:
      context: ./toeic-vocabulary-be
      target: development
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - ./toeic-vocabulary-be/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://toeic_user:toeic_password@mysql:3306/toeic_vocabulary
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: toeic_user
      DATABASE_PASSWORD: toeic_password
      DATABASE_NAME: toeic_vocabulary
      AUDIO_STORAGE_DIR: /app/uploads/audio
      TZ: Asia/Bangkok
    volumes:
      - ./toeic-vocabulary-be:/app
      - backend_node_modules:/app/node_modules
      - audio_data:/app/uploads/audio
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    init: true
    networks: [toeic_network]

  frontend:
    image: toeic-vocabulary-frontend:dev
    build:
      context: ./toeic-vocabulary-fe
      target: development
    restart: unless-stopped
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    env_file:
      - ./toeic-vocabulary-fe/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      TZ: Asia/Bangkok
    volumes:
      - ./toeic-vocabulary-fe:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    init: true
    networks: [toeic_network]

volumes:
  mysql_data:
    name: toeic_vocabulary_mysql_data
  audio_data:
    name: toeic_vocabulary_audio_data
  backend_node_modules:
    name: toeic_vocabulary_backend_node_modules
  frontend_node_modules:
    name: toeic_vocabulary_frontend_node_modules

networks:
  toeic_network:
    name: toeic_vocabulary_network
    driver: bridge

