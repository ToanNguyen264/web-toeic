openapi: 3.1.0
info:
  title: TOEIC Vocabulary API
  version: 1.2.0
  description: API xác thực, quản lý từ vựng, ví dụ TOEIC và audio luyện nghe.
servers:
  - url: http://localhost:3000/api
security: []
tags:
  - name: System
  - name: Auth
  - name: Admin
  - name: AI Content
  - name: Vocabularies
paths:
  /health:
    get:
      tags: [System]
      summary: Kiểm tra API và kết nối MySQL
      responses:
        "200":
          description: Hệ thống sẵn sàng
          content:
            application/json:
              schema:
                type: object
                required: [status, database, timestamp]
                properties:
                  status: { type: string, const: ok }
                  database: { type: string, const: connected }
                  timestamp: { type: string, format: date-time }
  /auth/register:
    post:
      tags: [Auth]
      summary: Tạo tài khoản và đăng nhập ngay, không xác minh email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { $ref: "#/components/responses/AuthSuccess" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Đổi refresh cookie lấy access token mới và xoay vòng refresh token
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Thu hồi refresh token và xóa cookie
      responses:
        "204": { description: Đăng xuất thành công }
  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy tài khoản hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Tài khoản hiện tại
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/ai-settings:
    get:
      tags: [Admin]
      summary: Xem trạng thái API key đã che kín
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Trạng thái cấu hình AI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettingsStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Admin]
      summary: Thay ElevenLabs hoặc Gemini API key
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                elevenlabsApiKey: { type: string, minLength: 10, maxLength: 500, format: password }
                geminiApiKey: { type: string, minLength: 10, maxLength: 500, format: password }
      responses:
        "200":
          description: Trạng thái sau khi cập nhật
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettingsStatus" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /vocabularies:
    get:
      tags: [Vocabularies]
      summary: Danh sách từ vựng của tài khoản hiện tại
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: status, in: query, schema: { type: string, enum: [all, unlearned, learned], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VocabularyPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Vocabularies]
      summary: Thêm từ vựng
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/VocabularyForm" }
      responses:
        "201": { $ref: "#/components/responses/VocabularySuccess" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /vocabularies/{id}/learned:
    patch:
      tags: [Vocabularies]
      summary: Đánh dấu từ vựng là đã thuộc hoặc chưa thuộc
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/VocabularyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isLearned]
              properties:
                isLearned: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/VocabularySuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vocabularies/check-duplicate:
    get:
      tags: [Vocabularies]
      summary: Kiểm tra từ tiếng Anh đã tồn tại trong tài khoản
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: word, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 150 } }
        - { name: excludeId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Kết quả kiểm tra
          content:
            application/json:
              schema:
                type: object
                required: [duplicate]
                properties: { duplicate: { type: boolean } }
  /vocabularies/{id}:
    put:
      tags: [Vocabularies]
      summary: Sửa từ vựng, thay hoặc xóa audio
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/VocabularyId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/VocabularyForm" }
      responses:
        "200": { $ref: "#/components/responses/VocabularySuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Vocabularies]
      summary: Xóa từ vựng và audio liên quan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/VocabularyId" }]
      responses:
        "204": { description: Đã xóa }
        "404": { $ref: "#/components/responses/NotFound" }
  /vocabularies/{id}/audio:
    get:
      tags: [Vocabularies]
      summary: Phát file audio riêng tư
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/VocabularyId" }]
      responses:
        "200":
          description: Nội dung audio
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/mp4: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
            audio/ogg: { schema: { type: string, format: binary } }
            audio/webm: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /vocabularies/{id}/example-audio:
    get:
      tags: [Vocabularies]
      summary: Phát audio câu ví dụ song ngữ riêng tư
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/VocabularyId" }]
      responses:
        "200":
          description: Audio đọc câu tiếng Anh, nghỉ 1,5 giây rồi đọc nghĩa tiếng Việt
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /ai/audio:
    post:
      tags: [AI Content]
      summary: Tạo file MP3 phát âm tiếng Anh bằng ElevenLabs
      description: File trả về được giữ tạm ở trình duyệt và chỉ được lưu khi người dùng lưu từ vựng.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 150, examples: [opportunity] }
      responses:
        "200":
          description: Audio MP3 đã tạo
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "502": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "504": { $ref: "#/components/responses/ServiceError" }
  /ai/example:
    post:
      tags: [AI Content]
      summary: Tạo câu ví dụ TOEIC và bản dịch bằng Gemini
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [word, meaning]
              properties:
                word: { type: string, minLength: 1, maxLength: 150, examples: [invoice] }
                meaning: { type: string, minLength: 1, maxLength: 1000, examples: [hóa đơn] }
      responses:
        "200":
          description: Ví dụ có cấu trúc
          content:
            application/json:
              schema:
                type: object
                required: [english, vietnamese, topic]
                properties:
                  english: { type: string, maxLength: 500 }
                  vietnamese: { type: string, maxLength: 1000 }
                  topic: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "502": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "504": { $ref: "#/components/responses/ServiceError" }
  /ai/example-audio:
    post:
      tags: [AI Content]
      summary: Tạo MP3 song ngữ với khoảng nghỉ 1,5 giây bằng ElevenLabs
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [english, vietnamese]
              properties:
                english: { type: string, minLength: 1, maxLength: 500 }
                vietnamese: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Audio MP3 song ngữ
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/ServiceError" }
        "502": { $ref: "#/components/responses/ServiceError" }
        "503": { $ref: "#/components/responses/ServiceError" }
        "504": { $ref: "#/components/responses/ServiceError" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    VocabularyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72, format: password }
    User:
      type: object
      required: [id, email, is_admin]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_admin: { type: boolean }
    ProviderSettingStatus:
      type: object
      required: [configured, masked_key, source, updated_at]
      properties:
        configured: { type: boolean }
        masked_key: { type: [string, "null"], description: Chỉ chứa phần key đã che và bốn ký tự cuối. }
        source: { type: string, enum: [environment, database] }
        updated_at: { type: [string, "null"], format: date-time }
    AiSettingsStatus:
      type: object
      required: [elevenlabs, gemini]
      properties:
        elevenlabs: { $ref: "#/components/schemas/ProviderSettingStatus" }
        gemini: { $ref: "#/components/schemas/ProviderSettingStatus" }
    AuthResult:
      type: object
      required: [user, accessToken]
      properties:
        user: { $ref: "#/components/schemas/User" }
        accessToken: { type: string, description: JWT ngắn hạn; refresh token nằm trong HttpOnly cookie. }
    VocabularyForm:
      type: object
      required: [englishWord, vietnameseMeaning]
      properties:
        englishWord: { type: string, minLength: 1, maxLength: 150 }
        vietnameseMeaning: { type: string, minLength: 1, maxLength: 1000 }
        removeCurrentAudio: { type: boolean, default: false }
        exampleEnglish: { type: string, maxLength: 500 }
        exampleVietnamese: { type: string, maxLength: 1000 }
        removeCurrentExampleAudio: { type: boolean, default: false }
        audio: { type: string, format: binary, description: "MP3/M4A/WAV/OGG/WebM, tối đa 5 MB." }
        exampleAudio: { type: string, format: binary, description: "Audio ví dụ song ngữ, tối đa 5 MB." }
    Vocabulary:
      type: object
      required: [id, user_id, english_word, normalized_word, vietnamese_meaning, is_learned, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        english_word: { type: string }
        normalized_word: { type: string }
        vietnamese_meaning: { type: string }
        audio_path: { type: [string, "null"] }
        audio_name: { type: [string, "null"] }
        audio_type: { type: [string, "null"] }
        audio_size: { type: [integer, "null"] }
        example_english: { type: [string, "null"] }
        example_vietnamese: { type: [string, "null"] }
        example_audio_path: { type: [string, "null"] }
        example_audio_name: { type: [string, "null"] }
        example_audio_type: { type: [string, "null"] }
        example_audio_size: { type: [integer, "null"] }
        is_learned: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VocabularyPage:
      type: object
      required: [items, total, page, pageSize, stats]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Vocabulary" } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        stats:
          type: object
          required: [unlearned, learned]
          properties:
            unlearned: { type: integer, minimum: 0 }
            learned: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string }
        details: {}
  responses:
    AuthSuccess:
      description: Xác thực thành công; phản hồi đồng thời đặt refresh cookie HttpOnly.
      headers:
        Set-Cookie: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResult" }
    VocabularySuccess:
      description: Thao tác thành công
      content:
        application/json:
          schema:
            type: object
            required: [item]
            properties: { item: { $ref: "#/components/schemas/Vocabulary" } }
    ValidationError:
      description: Dữ liệu không hợp lệ
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Chưa đăng nhập hoặc token hết hạn
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Tài khoản không có quyền quản trị
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Dữ liệu đã tồn tại
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Không tìm thấy tài nguyên thuộc tài khoản hiện tại
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceError:
      description: Gemini hoặc ElevenLabs không sẵn sàng, hết hạn mức hoặc phản hồi lỗi
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

